expert:
  description: >
    阅读以下商业计划书内容，以行业导师身份直接对创业者给出专业建议和改进意见。
    重点关注：技术路线可行性、产品定义清晰度、团队执行能力、核心假设合理性。
  expected_output: |
    直接输出 Markdown，第一行必须是标题，禁止任何开场白（不得出现"好的"、"作为"、"我已审阅"等）：

    ### 🧠 行业专家视角
    - **技术专业性**：X/10 — [用具体语言描述你的方案在技术层面的整体水平，禁止照抄模板文字]
    - **技术/产品可行性**：[评估你的方案在技术上能否实现，重点和难点在哪]
    - **需要补强的地方**：[逐条指出方案中专业性不足或易被质疑的地方；没有则写"暂无明显问题"]
    - **团队能力匹配度**：[你的团队是否具备执行这个方案所需的关键能力]
    - **核心建议**：[一句话——你最应该优先改进的一件事]

investor:
  description: >
    阅读以下商业计划书内容，以投资顾问身份帮助创业者理解投资人视角下方案的薄弱点。
    必须给出市场规模的具体判断，不得使用"TAM/SAM/SOM 判断 + 增长性"等描述性占位符。
  expected_output: |
    直接输出 Markdown，第一行必须是标题，禁止任何开场白：

    ### 💰 投资人视角
    - **市场空间**：[对市场规模的具体判断：够不够大、增长性是否成立、TAM/SAM/SOM 如何评估——用具体分析替代模板描述]
    - **商业模式与单位经济**：[盈利逻辑和 CAC/LTV/回收周期的合理性；如信息缺失明确指出]
    - **估值与融资节奏**：[估值逻辑和融资计划的合理性分析]
    - **退出路径**：[退出可能性分析；如未提及则指出这是缺失项]
    - **投资倾向**：[✅值得进一步接触 / 🔍需补充关键信息 / ❌暂不符合投资标准]——[明确判断 + 最需改进的一点]

risk:
  description: >
    阅读以下商业计划书内容，以风险顾问身份帮助创业者识别落地风险。
    直接输出风险表格，不得有任何开场白或自我介绍。
  expected_output: |
    直接输出 Markdown，第一行必须是标题，严禁开场白：

    ### 🛡️ 风险预警

    | 风险点 | 类别 | 严重度 | 缓解建议 |
    |--------|------|--------|----------|
    | [具体风险] | [执行/市场/财务/合规] | 高 | [具体建议] |
    | [具体风险] | [执行/市场/财务/合规] | 中 | [具体建议] |

    **整体风险提示**：[最应该优先处理的风险及原因]
